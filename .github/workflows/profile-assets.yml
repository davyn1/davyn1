# Builds the live languages card for the profile README daily and publishes it
# to the `output` branch, which the README reads from.
name: Profile assets

on:
  schedule:
    - cron: "17 8 * * *" # daily, 08:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml
      - scripts/**

permissions:
  contents: write # needed to push the `output` branch

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate languages card
        run: python scripts/live_stats.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
