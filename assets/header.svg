<svg xmlns="http://www.w3.org/2000/svg" width="800" height="236" viewBox="0 0 800 236" role="img" aria-label="Davy Nguyen. Systems administrator by day, software engineer in the making. I build Python backends and ship them to the cloud. Bay Area · County of Santa Clara · UC Irvine 2023. Now: building an AI agent harness. Next: a RAG project with evals.">
  <title>Davy Nguyen. Systems administrator by day, software engineer in the making. I build Python backends and ship them to the cloud. Bay Area · County of Santa Clara · UC Irvine 2023. Now: building an AI agent harness. Next: a RAG project with evals.</title>
  <style>
    .bob { animation: bob 5s ease-in-out infinite; }
    .bob2 { animation: bob 7s ease-in-out infinite reverse; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(6px, -3px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .drift { animation: drift linear infinite; }
    @keyframes drift { from { transform: translateX(-266px); } to { transform: translateX(266px); } }
    .edge { animation: hue 9s ease-in-out infinite alternate; }
    @keyframes hue { from { stop-color: #38bdf8; } to { stop-color: #f9a8d4; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
