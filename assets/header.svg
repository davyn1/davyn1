      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <clipPath id="panel"><rect x="2" y="2" width="796" height="232" rx="16"/></clipPath>
  </defs>
  <rect x="2" y="2" width="796" height="232" rx="16" fill="#0b1020"/>
