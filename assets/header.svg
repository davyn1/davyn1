  <rect x="2" y="2" width="796" height="232" rx="16" fill="none" stroke="url(#border)" stroke-width="2.5"/>
  <text x="36" y="46" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2.5">CLOUD PROFILE</text>
  <text x="36" y="92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#f1f5ff">Davy Nguyen</text>
  <text x="36" y="124" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a9b4d6">Systems administrator by day, software engineer in the making.</text>
  <text x="36" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a9b4d6">I build Python backends and ship them to the cloud.</text>
  <text x="36" y="180" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#6b77a3">Bay Area · County of Santa Clara · UC Irvine ’23</text>
