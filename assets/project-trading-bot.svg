<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-label="Project 03: Trading Bot. Multi-strategy Alpaca bot with ATR-based stops and risk limits. Python. Paper trading.">
  <title>Project 03: Trading Bot. Multi-strategy Alpaca bot with ATR-based stops and risk limits. Python. Paper trading.</title>
  <style>
