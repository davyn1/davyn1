      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <clipPath id="panel"><rect x="2" y="2" width="396" height="196" rx="16"/></clipPath>
  </defs>
