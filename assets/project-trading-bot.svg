  <text x="26" y="106" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a9b4d6">Multi-strategy Alpaca bot with</text>
  <text x="26" y="124" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a9b4d6">ATR-based stops and risk limits.</text>
