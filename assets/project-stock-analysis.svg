<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-label="Project 02: Stock Analysis. 28 indicators computed in code, explained by an LLM at 3 levels. Python. FastAPI + React.">
