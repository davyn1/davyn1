<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-label="Player 1: Davy Nguyen, Systems Administrator and Software Engineer. Press start.">
  <title>Player 1: Davy Nguyen, Systems Administrator and Software Engineer. Press start.</title>
  <style>
    
    .t { opacity: 0; animation: show 0s steps(1) forwards; }
    .sub { opacity: 0; animation: show 0s steps(1) 1.71s forwards; }
    .start { opacity: 0; animation: blink 1.1s steps(1) 2.11s infinite; }
    .tw { animation: twinkle 3s steps(1) infinite; }
    .gm { opacity: 0; animation: glitch-m 5s steps(1) 2.51s infinite; }
    .gc { opacity: 0; animation: glitch-c 5s steps(1) 2.51s infinite; }
    .main { animation: jitter 5s steps(1) 2.51s infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes twinkle { 0% { opacity: 1; } 70% { opacity: .35; } 85% { opacity: 1; } }
    @keyframes glitch-m { 0% { opacity: 0; } 90% { opacity: .85; transform: translate(-6px, 0); }
      92% { opacity: .85; transform: translate(5px, 2px); } 94% { opacity: 0; } }
    @keyframes glitch-c { 0% { opacity: 0; } 90% { opacity: .85; transform: translate(6px, -2px); }
      92% { opacity: .85; transform: translate(-4px, 0); } 94% { opacity: 0; } }
    @keyframes jitter { 0% { transform: none; } 90% { transform: translate(2px, 0); }
      92% { transform: translate(-2px, 0); } 94% { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .t, .sub, .start, .row, .seg, .coin { opacity: 1 !important; } }
  </style>
  <defs>
